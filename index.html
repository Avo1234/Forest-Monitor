<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForestGuard - Ranger Deforestation Early Warning System</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --accent-green: #10b981;
      --alert-red: #ef4444;
      --alert-orange: #f97316;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Left Sidebar */
    #sidebar {
      width: 420px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .header {
      padding: 16px;
      background: #111827;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header i { font-size: 24px; color: var(--accent-green); }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; color: var(--text-muted); }

    /* Weekly Selector & Filters */
    .controls-panel {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
    }

    .controls-panel label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    /* KPI Metrics */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-green);
    }
    .kpi-card.danger { border-left-color: var(--alert-red); }
    .kpi-card span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .kpi-card h2 { font-size: 20px; margin-top: 4px; font-weight: 700; }

    /* Alerts List */
    .alerts-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .section-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .alert-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .alert-card:hover {
      border-color: var(--accent-green);
      transform: translateY(-2px);
    }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: var(--alert-red); border: 1px solid var(--alert-red); }
    .badge-high { background: rgba(249, 115, 22, 0.2); color: var(--alert-orange); border: 1px solid var(--alert-orange); }

    .alert-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .alert-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

    .dispatch-btn {
      width: 100%;
      background: var(--accent-green);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dispatch-btn:hover { opacity: 0.9; }

    /* Map container */
    #map-container {
      flex: 1;
      position: relative;
    }
    #map { height: 100%; width: 100%; }

    /* Floating Legend */
    .map-legend {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      z-index: 999;
      color: var(--text-main);
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div id="sidebar">
    <div class="header">
      <i class="fa-solid fa-satellite-dish"></i>
      <div>
        <h1>ForestGuard Command</h1>
        <p>Sentinel-1 SAR Weekly Alert Console</p>
      </div>
    </div>

    <!-- Weekly Selector -->
    <div class="controls-panel">
      <label for="week-select"><i class="fa-regular fa-calendar-check"></i> Monitoring Week</label>
      <select id="week-select" onchange="switchWeek(this.value)">
        <option value="2026-W36">Week 36 (Aug 31 - Sep 06, 2026) [Current]</option>
        <option value="2026-W35">Week 35 (Aug 24 - Aug 30, 2026)</option>
        <option value="2026-W34">Week 34 (Aug 17 - Aug 23, 2026)</option>
        <option value="2026-W33">Week 33 (Aug 10 - Aug 16, 2026)</option>
      </select>
    </div>

    <!-- Metrics -->
    <div class="kpi-grid">
      <div class="kpi-card danger">
        <span>Deforestation Detected</span>
        <h2 id="kpi-ha">28.4 ha</h2>
      </div>
      <div class="kpi-card">
        <span>Active Incidents</span>
        <h2 id="kpi-alerts">5 Areas</h2>
      </div>
    </div>

    <!-- Weekly Alerts Queue -->
    <div class="alerts-container">
      <div class="section-title">
        <span>Prioritized Incidents</span>
        <span id="alert-count">5 Total</span>
      </div>
      <div id="alert-list"></div>
    </div>
  </div>

  <!-- Main Map Container -->
  <div id="map-container">
    <div id="map"></div>

    <!-- Map Legend -->
    <div class="map-legend">
      <div style="font-weight: 700; margin-bottom: 8px;">Alert Severity</div>
      <div class="legend-item">
        <div class="legend-box" style="background: #ef4444;"></div>
        <span>Critical (&gt; 5.0 ha / Road proximity)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background: #f97316;"></div>
        <span>High (2.0 - 5.0 ha)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.1);"></div>
        <span>Reserve Boundary (Ghana Protected Area)</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Map centered on your Ghana coordinates
    const map = L.map('map').setView([5.9268, -0.9858], 12);

    // High-resolution satellite basemap (Esri World Imagery)
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: '&copy; Esri & Maxar'
    }).addTo(map);

    // Monitored Polygon Boundary
    const aoiCoords = [
      [5.9000, -1.0200],
      [5.9000, -0.9500],
      [5.9550, -0.9500],
      [5.9550, -1.0200]
    ];
    L.polygon(aoiCoords, { color: '#3b82f6', weight: 2, fillOpacity: 0.05 }).addTo(map);

    // Sample Weekly Dataset (Matches Weekly SAR Batch Output)
    const weeklyData = {
      "2026-W36": {
        totalHa: 28.4,
        alerts: [
          { id: "ALT-902", lat: 5.9320, lon: -0.9780, ha: 12.1, severity: "critical", time: "2 days ago", desc: "Contiguous canopy loss adjacent to tributary road." },
          { id: "ALT-903", lat: 5.9180, lon: -0.9950, ha: 8.4, severity: "critical", time: "3 days ago", desc: "Rapid clearing inside core reserve boundary." },
          { id: "ALT-904", lat: 5.9450, lon: -0.9620, ha: 4.2, severity: "high", time: "4 days ago", desc: "Expanding selective logging cluster." },
          { id: "ALT-905", lat: 5.9100, lon: -0.9700, ha: 2.5, severity: "high", time: "6 days ago", desc: "Small clearing near agricultural boundary." },
          { id: "ALT-906", lat: 5.9390, lon: -1.0050, ha: 1.2, severity: "high", time: "6 days ago", desc: "Early disturbance signal." }
        ]
      },
      "2026-W35": {
        totalHa: 14.8,
        alerts: [
          { id: "ALT-881", lat: 5.9220, lon: -0.9820, ha: 9.3, severity: "critical", time: "Aug 28", desc: "Heavy machinery clear-cut signature." },
          { id: "ALT-882", lat: 5.9410, lon: -0.9910, ha: 5.5, severity: "high", time: "Aug 26", desc: "Canopy opening detected near waterbody." }
        ]
      }
    };

    let alertLayerGroup = L.layerGroup().addTo(map);

    function renderWeek(weekId) {
      alertLayerGroup.clearLayers();
      const current = weeklyData[weekId] || { totalHa: 0, alerts: [] };

      // Update KPI
      document.getElementById('kpi-ha').innerText = `${current.totalHa} ha`;
      document.getElementById('kpi-alerts').innerText = `${current.alerts.length} Areas`;
      document.getElementById('alert-count').innerText = `${current.alerts.length} Total`;

      const listContainer = document.getElementById('alert-list');
      listContainer.innerHTML = '';

      current.alerts.forEach(alert => {
        const color = alert.severity === 'critical' ? '#ef4444' : '#f97316';

        // Add Circle Marker on Map
        const marker = L.circleMarker([alert.lat, alert.lon], {
          radius: Math.max(8, Math.min(22, alert.ha * 2)),
          color: color,
          fillColor: color,
          fillOpacity: 0.6,
          weight: 2
        }).addTo(alertLayerGroup);

        marker.bindPopup(`
          <div style="font-family: sans-serif; font-size: 12px; color: #1e293b;">
            <b style="font-size: 14px; color: ${color};">${alert.id} (${alert.ha} ha)</b><br/>
            <b>Coords:</b> ${alert.lat.toFixed(4)}, ${alert.lon.toFixed(4)}<br/>
            <b>Status:</b> ${alert.desc}<br/>
            <hr style="margin: 6px 0;" />
            <button onclick="dispatchRanger('${alert.id}', ${alert.lat}, ${alert.lon})" style="background: #10b981; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; width: 100%;">
              <i class="fa-solid fa-person-rifle"></i> Dispatch Patrol Team
            </button>
          </div>
        `);

        // Build Sidebar Card
        const card = document.createElement('div');
        card.className = 'alert-card';
        card.innerHTML = `
          <div class="alert-header">
            <span class="badge badge-${alert.severity}">${alert.severity}</span>
            <span style="font-size: 11px; color: var(--text-muted);">${alert.time}</span>
          </div>
          <h3>${alert.id} &bull; ${alert.ha} Hectares</h3>
          <p>${alert.desc}</p>
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">
            <i class="fa-solid fa-location-dot"></i> ${alert.lat.toFixed(4)}, ${alert.lon.toFixed(4)}
          </div>
          <button class="dispatch-btn" onclick="dispatchRanger('${alert.id}', ${alert.lat}, ${alert.lon})">
            <i class="fa-solid fa-paper-plane"></i> Send Patrol GPS to Ranger App
          </button>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.tagName !== 'BUTTON') {
            map.flyTo([alert.lat, alert.lon], 15);
            marker.openPopup();
          }
        });

        listContainer.appendChild(card);
      });
    }

    function switchWeek(weekId) {
      renderWeek(weekId);
    }

    function dispatchRanger(id, lat, lon) {
      const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      alert(`🚨 Patrol Task Issued for Incident [${id}]!\nCoordinates: ${lat}, ${lon}\n\nOpening navigation route for field rangers.`);
      window.open(gmapsUrl, '_blank');
    }

    // Initial render
    renderWeek('2026-W36');
  </script>
</body>
</html>
