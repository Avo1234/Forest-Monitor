name: Weekly SAR Deforestation Pipeline

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 03:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-gee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Detection Job
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python run_weekly_pipeline.py

      - name: Commit and Push Weekly Alerts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.geojson
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update weekly SAR deforestation GeoJSON alerts"
          git push || true
